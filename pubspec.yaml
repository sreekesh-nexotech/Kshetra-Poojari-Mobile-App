name: kshetra_poojari
description: "Kshetra Poojari mobile app."
# Prevents accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.1+8

environment:
  sdk: ^3.12.2

# ---------------------------------------------------------------------------
# Dependencies
#
# Presentation packages, plus the networking stack the poojari API integration
# needs. The backend is Django with SESSION authentication — no JWT, no bearer
# token — so the transport is dio + a persistent cookie jar (see
# docs-flutter/pooja.md §3). Persistence packages from Technical_stack.md
# (hive, isar, razorpay, …) are still out of scope: the session cookie on disk
# is the only state that has to survive a cold start.
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Riverpod) — per Flutter Coding Standards.
  flutter_riverpod: ^2.6.1

  # Responsive sizing — mandatory per the responsiveness guide (.w/.h/.sp/.r).
  flutter_screenutil: ^5.9.3

  # Declarative routing / shell navigation for the bottom-nav tabs + auth stack.
  go_router: ^14.6.2

  # Vector nav-bar glyphs (extracted from the Kshetra design system).
  flutter_svg: ^2.0.10+1

  # Network image loading for deity thumbnails once the API supplies URLs.
  # Used today only through the mock seam; keeps the swap to real URLs trivial.
  cached_network_image: ^3.4.1

  # Date / number formatting (Gregorian dates, zero-padded counts, ₹ grouping).
  intl: ^0.19.0

  # ── Networking ────────────────────────────────────────────────────────────
  # Django session auth: the sessionid + csrftoken cookies ARE the credentials,
  # so the jar must persist to disk or the poojari re-logs in on every launch.
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Application-support directory for the cookie jar's FileStorage.
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Variable fonts bundled locally for an exact, offline design match.
  # Noto Sans Malayalam ships a wdth (62.5–100) axis — the app renders it at
  # width 75 (condensed) via FontVariation, matching the design system.
  fonts:
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Variable.ttf
    - family: NotoSerifMalayalam
      fonts:
        - asset: assets/fonts/NotoSerifMalayalam-Variable.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    # Fallback for ✓ / ✕ marks (the design used them as text glyphs; the
    # primary faces don't cover U+2713 / U+2715).
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
