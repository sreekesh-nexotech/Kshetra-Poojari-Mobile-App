name: kshetra_poojari
description: "Kshetra Poojari mobile app."
# Prevents accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.1+8

environment:
  sdk: ^3.12.2

# ---------------------------------------------------------------------------
# Dependencies
#
# This session builds the PRESENTATION layer only. Only the packages the UI +
# its Riverpod state actually need are declared here. Networking / persistence
# packages from Technical_stack.md (dio, retrofit, hive, isar, razorpay, …) are
# intentionally NOT added yet — they belong to the Infrastructure/Application
# data layers, which are out of scope for this session and will be wired when
# the API is integrated.
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Riverpod) — per Flutter Coding Standards.
  flutter_riverpod: ^2.6.1

  # Responsive sizing — mandatory per the responsiveness guide (.w/.h/.sp/.r).
  flutter_screenutil: ^5.9.3

  # Declarative routing / shell navigation for the bottom-nav tabs + auth stack.
  go_router: ^14.6.2

  # Vector nav-bar glyphs (extracted from the Kshetra design system).
  flutter_svg: ^2.0.10+1

  # Network image loading for deity thumbnails once the API supplies URLs.
  # Used today only through the mock seam; keeps the swap to real URLs trivial.
  cached_network_image: ^3.4.1

  # Date / number formatting (Gregorian dates, zero-padded counts, ₹ grouping).
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Variable fonts bundled locally for an exact, offline design match.
  # Noto Sans Malayalam ships a wdth (62.5–100) axis — the app renders it at
  # width 75 (condensed) via FontVariation, matching the design system.
  fonts:
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Variable.ttf
    - family: NotoSerifMalayalam
      fonts:
        - asset: assets/fonts/NotoSerifMalayalam-Variable.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
